[workspace]
resolver = "3"
members = [
    "crates/imprenta-core",
    "crates/imprenta-pdf",
    "crates/imprenta-xlsx",
    "crates/imprenta-pdf-wasm",
    "crates/imprenta-xlsx-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/imprenta-project/imprenta"
homepage = "https://github.com/imprenta-project/imprenta"
authors = ["AbianS"]

[workspace.dependencies]
imprenta-core = { path = "crates/imprenta-core", version = "0.0.0" }
imprenta-pdf = { path = "crates/imprenta-pdf", version = "0.0.0" }
imprenta-xlsx = { path = "crates/imprenta-xlsx", version = "0.0.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

parley = "0.6"
krilla = { version = "0.7.0", features = ["rayon"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

# Layout and shaping are unusably slow unoptimised, so dependencies get real
# optimisation even in dev builds. Our own crates stay unoptimised for fast
# incremental rebuilds and usable backtraces.
[profile.dev.package."*"]
opt-level = 2
