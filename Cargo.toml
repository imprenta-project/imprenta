[workspace]
resolver = "3"
members = [
    "crates/imprenta-core",
    "crates/imprenta-pdf",
    "crates/imprenta-pdf-write",
    "crates/imprenta-xlsx",
    "crates/imprenta-pdf-wasm",
    "crates/imprenta-xlsx-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/imprenta-project/imprenta"
homepage = "https://github.com/imprenta-project/imprenta"
authors = ["AbianS"]

[workspace.dependencies]
imprenta-core = { path = "crates/imprenta-core", version = "0.0.0" }
imprenta-pdf = { path = "crates/imprenta-pdf", version = "0.0.0" }
imprenta-pdf-write = { path = "crates/imprenta-pdf-write", version = "0.0.0" }
imprenta-xlsx = { path = "crates/imprenta-xlsx", version = "0.0.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

parley = "0.6"
rayon = "1.10"

# What `imprenta-pdf-write` is built out of. `pdf-writer` and `subsetter` are
# the two crates the writer this replaced sat on itself, so none of this is a
# new risk — it is the same code with the layer that held every page until the
# document closed taken off the top.
pdf-writer = "0.14.0"
subsetter = "0.2.6"
skrifa = "0.44.0"
miniz_oxide = "0.8.9"
png = "0.17.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

# Layout and shaping are unusably slow unoptimised, so dependencies get real
# optimisation even in dev builds. Our own crates stay unoptimised for fast
# incremental rebuilds and usable backtraces.
[profile.dev.package."*"]
opt-level = 2
