name: Publish

# Five packages, one job.
#
# This file used to be three hundred lines: a matrix compiling two native
# addons for five targets each, an artifact dance to collect the ten `.node`
# files, `napi create-npm-dirs` to generate ten per-platform packages, and a
# guard against one of those addons ending up inside the package whose whole
# job was to choose between them.
#
# All of it existed because a `.node` has to be linked on a machine that can
# produce that target. The engines are WebAssembly now — one module each, built
# on whatever runner is to hand, running in Node, a browser, Deno, Bun and on
# the edge — so none of that is needed and none of it is here.
#
# npm only. Nothing here touches crates.io.

on:
  release:
    types: [published]
  # A publish that failed halfway is the normal reason to be here. Changesets
  # skips versions already on the registry, so rerunning finishes the job
  # rather than tripping over its own first half.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance. The attestation is checked against the workflow and the
      # repository it ran in — they all say `imprenta-project/imprenta`, so
      # publishing from a fork or from a repository under another owner fails
      # here rather than shipping an unattested package.
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      # A `release` event checks out the tag, which is the commit the version
      # pull request produced.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # `rust-toolchain.toml` pins the version; this only adds the target.
      # There is exactly one, and adding a second would mean the "one artefact"
      # claim had quietly stopped being true.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Compiles both WebAssembly modules and builds every package that ships
      # compiled output — `@imprentajs/react`, `@imprentajs/fonts` and the
      # preview UI included.
      - run: pnpm run build

      # The one thing worth checking before it goes out: a package whose
      # module is missing installs cleanly and fails on the first render.
      - name: Refuse to ship a package with no engine in it
        run: |
          set -euo pipefail
          for pkg in pdf xlsx; do
            module="imprenta-$pkg.wasm"
            if ! npm pack --dry-run --json "./packages/$pkg" | grep -q "$module"; then
              echo "::error::packages/$pkg would publish without $module. Check its \`files\`."
              exit 1
            fi
          done

      # Changesets shells out to `pnpm publish`, which is what replaces
      # `workspace:*` with the exact version in the published tarball. Plain
      # `npm publish` would ship the literal `workspace:*` and every install
      # would fail. It also skips versions already on the registry, so this is
      # safe to rerun.
      #
      # No `--tag`: changesets refuses one in pre-release mode — "Releasing
      # under custom tag is not allowed in pre mode" — and publishes under the
      # pre tag itself, which is `alpha`.
      - name: Publish
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
